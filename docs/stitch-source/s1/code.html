<body class="flex flex-col min-h-screen max-w-[480px] mx-auto bg-surface overflow-hidden">
<!-- Top Progress Bar (Editorial Spine Concept) -->
<div class="fixed top-0 left-0 w-full h-[2px] bg-divider-line z-50">
<div class="h-full bg-green-cheonhyangrang w-1/12"></div>
</div>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col px-container-margin pt-element-gap-lg pb-element-gap-lg relative">
<!-- Header Section -->
<header class="mb-element-gap-md">
<span class="font-english-subtitle text-english-subtitle text-secondary mb-2 block uppercase">
                WALK, BECOME A BOOK
            </span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tighter break-keep leading-tight">
                책이 되어 걷다
            </h1>
<p class="font-body-main text-body-main text-secondary mt-6 max-w-[280px] break-keep opacity-80">
                당신의 발걸음이 문장이 되고,<br/>풍경은 한 권의 서사가 됩니다.
            </p>
</header>
<!-- Aesthetic Empty Space (Vastness for Contemplation) -->
<div class="flex-grow flex items-center justify-center">
<!-- Subtle abstract decorative element (museum card style) -->
<div class="w-[1px] h-32 bg-divider-line opacity-50"></div>
</div>
<!-- Call to Action -->
<footer class="mt-auto">
<div class="mb-element-gap-sm flex flex-col gap-2">
<span class="font-caption-muted text-caption-muted text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]">auto_stories</span>
                    새로운 여정을 시작할 준비가 되셨나요?
                </span>
</div>
<button class="btn-start w-full py-5 border border-green-cheonhyangrang text-green-cheonhyangrang font-button-text text-button-text tracking-widest transition-all duration-200 bg-transparent flex justify-between items-center px-8" onclick="handleStart()">
<span>시작하기</span>
<span class="material-symbols-outlined">north_east</span>
</button>
</footer>
</main>
<!-- Background Atmospheric Texture (Soft Paper Grain Simulation) -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03]" style="background-image: url('https://www.transparenttextures.com/patterns/natural-paper.png');"></div>
<!-- Shared Navigation Components (Supressed as per Transactional/Opening Screen Logic) -->
<!-- The TopAppBar and BottomNavBar are defined in JSON but suppressed here to prioritize the "Opening Screen" canvas as instructed in the "Semantic Shell Mandate". -->
<script>
        function handleStart() {
            // Simple visual feedback for interaction
            const btn = document.querySelector('.btn-start');
            btn.innerHTML = '<span class="flex items-center gap-3">불러오는 중... <span class="w-1 h-1 bg-green-cheonhyangrang animate-ping"></span></span>';
            
            setTimeout(() => {
                console.log("Navigating to journey selection...");
                // In a real app, this would trigger navigation
            }, 1000);
        }

        // Entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('header > *, footer, main > div');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = `all 0.8s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.1}s`;
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100);
            });
        });
    </script>
