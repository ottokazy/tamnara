<script>
        // Micro-interactions for the input field
        const inputField = document.querySelector('input');
        const sendButton = document.querySelector('button');

        inputField.addEventListener('focus', () => {
            document.body.style.transition = 'background-color 0.8s ease';
            document.body.style.backgroundColor = '#f8f7f2'; // Slightly lighter tone shift
        });

        inputField.addEventListener('blur', () => {
            document.body.style.backgroundColor = '#F2F1EC';
        });

        // Simple fade-in effect for the question
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.librarian-container');
            container.style.opacity = '0';
            container.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                container.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 300);
        });
